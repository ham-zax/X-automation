# Growth OS runtime configuration. The service reads this file at each session.
# Change models or role bindings here. Use secretRef for a secret reference only.
version: 1

# Discovery cadence. Wall-clock blocks decide which stream each pass reads, so a
# session restart continues the rotation instead of resetting it.
schedule:
  blockSeconds: 300
  order: momentum,forYou
  restWatchMinutes: 60
  builderRefreshMinutes: 60

ai:
  totalTimeoutMs: 240000

# Native Codex only. No codexHome, sandbox or network override: the runtime uses
# ~/.codex and the safe read-only role defaults.
runtimes:
  codex:
    binaryPath: /home/ubuntu/.local/bin/codex

operator:
  runtime: claive
  engine: codex
  model: gpt-6.1-terra
  reasoning: low
  replyWriterMode: profile
  browserTarget: linux
  browserInterface: agent-browser-cli
  browserMcpServer: xgrowth_browser
  browserFastBackend: cloakbrowser
  cdpPort: '9222'
  windowMinutes: 12

roles:
  continuous_scan:
    runtime: codex
    model: gpt-6.1-terra
    reasoning: low
  editorial_scan:
    runtime: codex
    model: gpt-6.1-terra
    reasoning: low
  editorial_final:
    runtime: codex
    model: gpt-6.1-terra
    reasoning: low
  audience_review:
    runtime: codex
    model: gpt-6.1-terra
    reasoning: low
  writer:
    runtime: codex
    model: gpt-6.1-terra
    reasoning: low
  reply_writer:
    runtime: codex
    model: gpt-6.1-terra
    reasoning: low
  content_review:
    runtime: codex
    model: gpt-6.1-terra
    reasoning: low
