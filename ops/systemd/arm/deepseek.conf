# Operator model selection. Writer selection lives in Growth OS AI settings.
[Unit]
Description=XGrowth attached DeepSeek V4.1 operator

[Service]
Environment=X_GROWTH_AGENT_RUNTIME=opencode
Environment=X_GROWTH_AGENT_MODEL=opencode2api/deepseek-v4.1-flash-free
Environment=X_GROWTH_AGENT_REASONING=max
Environment=X_GROWTH_REPLY_WRITER_MODE=profile
Environment=X_GROWTH_OPENCODE_BIN=/home/ubuntu/.opencode/bin/opencode
