# Live Terra operator. Writer and reviewer bindings stay in Growth OS AI Settings.
[Unit]
Description=XGrowth attached Terra 6.1 medium operator

[Service]
Environment=X_GROWTH_AGENT_RUNTIME=claive
Environment=X_GROWTH_CLAIVE_ENGINE=codex
Environment=X_GROWTH_AGENT_MODEL=gpt-6.1-terra
Environment=X_GROWTH_AGENT_REASONING=medium
Environment=X_GROWTH_REPLY_WRITER_MODE=profile
